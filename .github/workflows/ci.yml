name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Translations compile
        run: |
          sudo apt-get update -q && sudo apt-get install -yq gettext
          for po in po/*.po; do msgfmt --check -o /dev/null "$po"; done
      - name: Package metadata is valid JSON
        run: python3 -m json.tool package/metadata.json > /dev/null
